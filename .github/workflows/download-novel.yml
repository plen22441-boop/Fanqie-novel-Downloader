name: Download Novel — Boluomao1

on:
  workflow_dispatch:
    inputs:
      book_url:
        description: "URL หนังสือ หรือ book_id (เช่น https://www.boluomao1.com/book/850578.html หรือแค่ 850578)"
        required: true
        type: string
      start_chapter:
        description: "ตอนเริ่มต้น (ค่าเริ่มต้น 1)"
        required: false
        default: "1"
        type: string
      end_chapter:
        description: "ตอนสุดท้าย (ว่างไว้ = โหลดทุกตอน)"
        required: false
        default: ""
        type: string
      delay_ms:
        description: "หน่วงเวลาระหว่างตอน (ms) ค่าเริ่มต้น 700"
        required: false
        default: "700"
        type: string

jobs:
  download:
    name: Download chapters
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Download novel
        run: |
          END_ARG=""
          if [ -n "${{ inputs.end_chapter }}" ]; then
            END_ARG="--end ${{ inputs.end_chapter }}"
          fi
          # extract book_id for artifact name (strip URL to digits only)
          BOOK_ID=$(echo "${{ inputs.book_url }}" | grep -oP '\d{5,}' | head -1)
          echo "BOOK_ID=${BOOK_ID}" >> $GITHUB_ENV
          python scraper/boluomao1.py \
            "${{ inputs.book_url }}" \
            --start "${{ inputs.start_chapter }}" \
            $END_ARG \
            --delay "${{ inputs.delay_ms }}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-${{ env.BOOK_ID }}-ch${{ inputs.start_chapter }}-${{ inputs.end_chapter || 'end' }}
          path: output/
          retention-days: 7
