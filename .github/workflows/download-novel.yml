name: Download Novel

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Book ID หรือ URL (เช่น 7143038691940959460)"
        required: true
      workers:
        description: "จำนวน parallel workers (แนะนำ 20)"
        required: false
        default: "20"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Download novel
        id: download
        run: |
          python download_novel.py "${{ github.event.inputs.book_id }}" \
            --workers ${{ github.event.inputs.workers }} \
            --output downloads \
            --retries 5

      - name: Set artifact name
        id: artifact_name
        run: |
          SAFE=$(echo "${{ github.event.inputs.book_id }}" | grep -oE '[0-9]+' | tail -1)
          echo "name=novel-${SAFE}" >> $GITHUB_OUTPUT

      - name: Upload TXT file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: downloads/*.txt
          retention-days: 7

      - name: Summary
        run: |
          echo "### ✅ โหลดเสร็จแล้ว" >> $GITHUB_STEP_SUMMARY
          echo "- Book ID: \`${{ github.event.inputs.book_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Workers: ${{ github.event.inputs.workers }}" >> $GITHUB_STEP_SUMMARY
          echo "- ดาวน์โหลดไฟล์ TXT ได้จาก **Artifacts** ด้านบน" >> $GITHUB_STEP_SUMMARY
