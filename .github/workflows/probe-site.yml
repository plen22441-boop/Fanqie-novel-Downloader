name: Probe Site

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL หน้าหนังสือที่ต้องการสำรวจ"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install playwright
          python -m playwright install chromium --with-deps
      - run: python probe_site.py "${{ github.event.inputs.url }}"
