name: Listing kit — ข้อมูลลงเรื่อง MyNovel

# ทำแยกได้โดยไม่ต้องโหลดนิยายใหม่: อ่านแค่หน้าเรื่องหน้าเดียว
on:
  workflow_dispatch:
    inputs:
      book_url:
        description: "ลิงก์หน้าเรื่อง (fanqienovel / biquge365 / 69shu / boluomao1 ฯลฯ)"
        required: true
        type: string

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build listing kit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOOK_URL: ${{ inputs.book_url }}
        run: |
          git fetch --depth 1 origin mynovel-data:refs/remotes/origin/mynovel-data || true
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -q anthropic; fi
          python scraper/listing_kit.py "$BOOK_URL" --out output
          cat output/LISTING_*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-kit
          path: output/LISTING_*
          retention-days: 30
