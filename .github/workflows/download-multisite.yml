name: Download Novel — Multi-site

on:
  workflow_dispatch:
    inputs:
      novel_url:
        description: "วางลิงก์นิยายได้เลย (รองรับ biquge365 / 69shu / shubaowb / zhys / 4jiwx / shuixxs)"
        required: true
        default: "https://m.biquge365.net/shu/528722/"
        type: string
      novel_name:
        description: "ชื่อไฟล์ที่บันทึก (ไม่ใส่ก็ได้ ระบบตั้งชื่อให้)"
        required: false
        default: ""
        type: string
      total_chapters:
        description: "จำนวนตอน (เฉพาะ shuixxs/4jiwx เท่านั้น)"
        required: false
        default: "523"
        type: string
      workers:
        description: "จำนวน workers (1-15)"
        required: false
        default: "3"
        type: string
      delay:
        description: "หน่วง (วินาที)"
        required: false
        default: "2"
        type: string
      min_chars:
        description: "QC: ขั้นต่ำตัวอักษรต่อตอน"
        required: false
        default: "300"
        type: string

jobs:
  download:
    name: Download chapters
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q aiohttp

      - name: Download novel
        env:
          NOVEL_URL: ${{ inputs.novel_url }}
          NOVEL_NAME: ${{ inputs.novel_name }}
          TOTAL_CHAPTERS: ${{ inputs.total_chapters }}
          WORKERS: ${{ inputs.workers }}
          DELAY: ${{ inputs.delay }}
          MIN_CHARS: ${{ inputs.min_chars }}
          OUTPUT_DIR: ./output
        run: |
          mkdir -p output
          python scripts/download_novel.py

      - name: Show result
        if: always()
        run: |
          echo "=== Files ==="
          ls -lh output/ 2>/dev/null || echo "No output"
          echo ""
          echo "=== QC Summary ==="
          python3 -c "
          import json, glob, sys
          files = glob.glob('output/*_QC.json')
          if not files:
              print('No QC report (site may not support QC yet)')
              sys.exit(0)
          for f in files:
              d = json.load(open(f, encoding='utf-8'))
              print(f'Book   : {d[\"book\"]}')
              print(f'Total  : {d[\"total_chapters\"]}  OK:{d[\"ok\"]}  Short:{d[\"short\"]}  Failed:{d[\"failed\"]}')
              if d['short_chapters']:
                  print('Short  :')
                  for s in d['short_chapters'][:10]:
                      print(f'  #{s[\"no\"]} {s[\"title\"]} ({s[\"chars\"]} chars)')
              if d['failed_chapters']:
                  print('Failed :')
                  for f2 in d['failed_chapters'][:10]:
                      print(f'  #{f2[\"no\"]} {f2[\"title\"]} — {f2[\"error\"]}')
          " 2>/dev/null || true
          echo ""
          echo "=== First 20 lines of TXT ==="
          head -20 output/*.txt 2>/dev/null || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-download
          path: |
            output/*.txt
            output/*.json
          retention-days: 30
