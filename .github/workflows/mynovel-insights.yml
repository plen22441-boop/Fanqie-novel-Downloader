name: MyNovel Insights (เก็บข้อมูลทุกชั่วโมง)

# เปิดหน้า MyNovel ตาม mynovel_insights/config.json ทุกชั่วโมง
# เก็บผลไว้ใน branch "mynovel-data" (ไม่ทำให้ประวัติ main รก)
# แล้วเผยแพร่แดชบอร์ดผ่าน GitHub Pages (ต้องเปิด Settings → Pages → Source: GitHub Actions ก่อน)
# repo นี้บังคับให้ทุก action ระบุเป็น commit SHA เต็ม (ความเห็นท้ายบรรทัดบอกเวอร์ชัน)

on:
  schedule:
    - cron: "17 * * * *" # ทุกชั่วโมง นาทีที่ 17 (GitHub อาจเลื่อน/ข้ามบางรอบ ระบบรองรับแล้ว)
  workflow_dispatch:
    inputs:
      debug:
        description: "โหมดตรวจสอบ: พิมพ์โครงสร้างข้อมูลของเว็บลง log (ใช้ตอนปรับตัวเก็บข้อมูล)"
        type: boolean
        default: false

# ล็อกเฉพาะ job ที่เขียนข้อมูล/อัปโหลดหน้าเว็บ (ไม่ล็อกทั้ง workflow)
# เพื่อให้ปุ่ม Run workflow ที่กดเองรันได้ทันที แม้รอบในห่วงโซ่กำลังรอชั่วโมงถัดไป

env:
  DATA_BRANCH: mynovel-data
  PLAYWRIGHT_VERSION: 1.49.1

jobs:
  collect:
    runs-on: ubuntu-24.04 # Playwright ที่ใช้รองรับถึง 24.04
    concurrency:
      group: mynovel-collect
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      code: ${{ steps.collect.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" "$DATA_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$DATA_BRANCH" "$REMOTE" _data
          else
            mkdir _data && cd _data
            git init -b "$DATA_BRANCH"
            git remote add origin "$REMOTE"
            echo "ข้อมูลที่เก็บอัตโนมัติโดย .github/workflows/mynovel-insights.yml" > README.md
          fi

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Cache Playwright browser
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Collect
        id: collect
        env:
          MNI_DEBUG: ${{ inputs.debug || 'false' }}
        run: |
          set +e
          DATA_DIR=_data node mynovel_insights/ci/collect.js
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit data
        run: |
          cd _data
          git add -A
          if git diff --cached --quiet; then echo "ไม่มีข้อมูลใหม่"; exit 0; fi
          git -c user.name="mynovel-insights-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push -q origin "HEAD:${DATA_BRANCH}" && exit 0
            sleep $((i * 5))
            git pull -q --rebase origin "$DATA_BRANCH" || true
          done
          exit 1

      - name: Fail if nothing was collected
        if: steps.collect.outputs.code != '0'
        run: |
          echo "::error::รอบนี้ไม่ได้ข้อมูลเลย — ดูตารางใน Summary ว่าหน้าไหนเปิดไม่ได้ (อาจโดนกันบอท หรือ URL ใน config.json ผิด)"
          exit 1

  pages:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04 # Playwright ที่ใช้รองรับถึง 24.04
    concurrency:
      group: mynovel-pages
      cancel-in-progress: false
    # ถ้ายังไม่เปิด GitHub Pages ขั้นนี้จะพัง แต่ไม่ทำให้การเก็บข้อมูลล้มเหลว
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data
          cp mynovel_insights/index.html mynovel_insights/insights-core.js mynovel_insights/mynovel-collector.user.js _site/
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch "$DATA_BRANCH" "$REMOTE" _data; then
            cp _data/latest.json _site/data/ 2>/dev/null || true
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # แทน actions/upload-pages-artifact (ข้างในเรียก upload-artifact@v4 แบบไม่ pin SHA ซึ่งโดนบล็อก)
      - name: Archive site
        run: tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # GitHub มักไม่รัน/รันช้ามากสำหรับงานตั้งเวลาใน repo ที่ fork มา (7 ชม.แรกไม่รันเลยสักรอบ)
  # จึงให้แต่ละรอบรอจนถึงนาทีที่ 17 ของชั่วโมงถัดไป แล้วสั่งรันรอบใหม่เอง (ห่วงโซ่)
  # workflow_dispatch ที่สั่งด้วย GITHUB_TOKEN สร้างรอบใหม่ได้ (ข้อยกเว้นที่ GitHub อนุญาต)
  next:
    needs: [collect, pages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      actions: write
    steps:
      - name: Wait for the next hour, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          now=$(date +%s)
          target=$(( now - now % 3600 + 17 * 60 ))
          if [ "$target" -le $(( now + 300 )) ]; then target=$(( target + 3600 )); fi
          echo "รอ $(( (target - now) / 60 )) นาที จนถึง $(date -u -d @"$target" +%H:%MZ)"
          sleep $(( target - now ))
          # ถ้ามีรอบที่ "ใหม่กว่า" รอคิว/กำลังรันอยู่ (กดรันเอง หรือจากตัวตั้งเวลา) ให้รอบนั้นต่อห่วงโซ่แทน
          # -> มีห่วงโซ่เดียวเสมอ: ไม่ซ้อน และไม่ขาด (รอบที่ใหม่สุดเป็นคนสั่งรอบถัดไป)
          others=$(gh run list --workflow mynovel-insights.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId > ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length")
          if [ "$others" -gt 0 ]; then echo "มีรอบที่ใหม่กว่าอยู่แล้ว ($others) ให้รอบนั้นต่อห่วงโซ่"; exit 0; fi
          gh workflow run mynovel-insights.yml --ref "${GITHUB_REF_NAME}"
          echo "สั่งรอบถัดไปแล้ว"
